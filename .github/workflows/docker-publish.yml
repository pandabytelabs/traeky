name: Publish containers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only release-bearing branch pushes may publish. Pull requests are
    # deliberately excluded: a workflow_run job runs with repository secrets and
    # would otherwise push an unreviewed PR head to the `latest`/`stable` tags.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Resolve publish channel
        id: publish
        shell: bash
        # Untrusted workflow_run fields are passed through the environment, never
        # interpolated into the script body: branch and tag names may contain
        # shell metacharacters.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          publish=false
          branch="${GITHUB_REF_NAME:-}"
          commit="${GITHUB_SHA}"
          channel=""
          tags=""

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            commit="${RUN_HEAD_SHA}"
            branch="${RUN_HEAD_BRANCH}"
          fi

          case "${branch}" in
            main)
              publish=true
              channel="stable"
              tags="latest stable"
              ;;
            develop)
              publish=true
              channel="dev"
              tags="dev"
              ;;
            *)
              echo "No Docker publish channel for branch '${branch}'."
              ;;
          esac

          {
            echo "publish=${publish}"
            echo "commit=${commit}"
            echo "channel=${channel}"
            echo 'channel_tags<<EOF_TAG_RULES'
            if [[ "${publish}" == "true" ]]; then
              for tag in ${tags}; do
                echo "type=raw,value=${tag}"
              done
            fi
            echo 'EOF_TAG_RULES'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.publish.outputs.publish == 'true' }}
        with:
          ref: ${{ steps.publish.outputs.commit }}
      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.publish.outputs.publish == 'true' }}
      - uses: docker/login-action@v4
        if: ${{ steps.publish.outputs.publish == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker Hub configuration
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: dockerhub
        shell: bash
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: ${{ steps.publish.outputs.publish == 'true' && steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # Runs after checkout: the source version and the commit that was actually
      # built are only knowable here. metadata-action's own type=sha would tag
      # github.sha, which for a workflow_run event is the default branch head and
      # not the ref this job checked out.
      - name: Resolve source version
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: version
        shell: bash
        env:
          CHANNEL: ${{ steps.publish.outputs.channel }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version.txt does not contain a usable version: '${version}'" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo 'extra_tags<<EOF_EXTRA'
            echo "type=raw,value=sha-${COMMIT::7}"
            # Only the stable channel carries the release number: develop can be
            # ahead of the released version.
            if [[ "${CHANNEL}" == "stable" ]]; then
              echo "type=raw,value=${version}"
            fi
            echo 'EOF_EXTRA'
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${CHANNEL} channel as version ${version} from ${COMMIT}"

      - name: Resolve image names
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: images
        shell: bash
        run: |
          {
            echo 'dashboard<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY}-dashboard"
            if [[ "${{ steps.dockerhub.outputs.enabled }}" == 'true' ]]; then
              echo "${DOCKERHUB_USERNAME}/traeky-dashboard"
            fi
            echo 'EOF'
            echo 'cloud<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY}-cloud"
            if [[ "${{ steps.dockerhub.outputs.enabled }}" == 'true' ]]; then
              echo "${DOCKERHUB_USERNAME}/traeky-cloud"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: meta-dashboard
        with:
          images: ${{ steps.images.outputs.dashboard }}
          tags: |
            ${{ steps.publish.outputs.channel_tags }}
            ${{ steps.version.outputs.extra_tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.publish.outputs.commit }}
      - uses: docker/metadata-action@v6
        if: ${{ steps.publish.outputs.publish == 'true' }}
        id: meta-cloud
        with:
          images: ${{ steps.images.outputs.cloud }}
          tags: |
            ${{ steps.publish.outputs.channel_tags }}
            ${{ steps.version.outputs.extra_tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.publish.outputs.commit }}
      - name: Build and publish Dashboard image
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          build-args: |
            TRAEKY_COMMIT=${{ steps.publish.outputs.commit }}
          cache-from: type=gha,scope=dashboard-${{ steps.publish.outputs.channel }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ steps.publish.outputs.channel }}
      - name: Build and publish Cloud image
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cloud
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-cloud.outputs.tags }}
          labels: ${{ steps.meta-cloud.outputs.labels }}
          build-args: |
            TRAEKY_COMMIT=${{ steps.publish.outputs.commit }}
          cache-from: type=gha,scope=cloud-${{ steps.publish.outputs.channel }}
          cache-to: type=gha,mode=max,scope=cloud-${{ steps.publish.outputs.channel }}
