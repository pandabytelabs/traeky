name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: traeky
          POSTGRES_USER: traeky
          POSTGRES_PASSWORD: traeky_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traeky -d traeky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRAEKY_TEST_DATABASE_URL: postgres://traeky:traeky_test_password@localhost:5432/traeky?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath ./cmd/traeky

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: traeky-dashboard:ci
      - name: Build cloud image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cloud
          push: false
          tags: traeky-cloud:ci
